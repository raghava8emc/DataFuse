<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Ingestion Setup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Data Ingestion Setup</h2>

        <form id="ingestForm">
            <!-- Step 1: Select Source Type -->
            <label for="sourceType">Select Source Type:</label>
            <select id="sourceType">
                <option value="restapi">REST API</option>
                <option value="sftp">SFTP</option>
            </select>
            <button type="button" id="nextToConfig">Next</button>

            <!-- REST API Configuration -->
            <div id="restApiConfig" class="hidden">
                <label for="baseUrl">Base URL:</label>
                <input type="text" id="baseUrl" placeholder="https://example.com">

                <label for="endpoints">Endpoints (comma-separated):</label>
                <input type="text" id="endpoints" placeholder="posts,comments,albums">

                <label for="contentType">Content Type:</label>
                <select id="contentType">
                    <option value="application/json">JSON</option>
                    <option value="text/xml">XML</option>
                    <option value="text/csv">CSV</option>
                    <option value="application/x-ndjson">NDJSON</option>
                </select>
            </div>

            <!-- SFTP Configuration -->
            <div id="sftpConfig" class="hidden">
                <label for="sftpHost">Host:</label>
                <input type="text" id="sftpHost" placeholder="sftp.example.com">

                <label for="sftpPort">Port:</label>
                <input type="number" id="sftpPort" placeholder="22">

                <label for="sftpUsername">Username:</label>
                <input type="text" id="sftpUsername" placeholder="user123">

                <label for="sftpPassword">Password:</label>
                <input type="password" id="sftpPassword" placeholder="password">

                <label for="remotePath">Remote Path:</label>
                <input type="text" id="remotePath" placeholder="/remote/data/">

                <label for="filePatterns">File Patterns:</label>
                <select id="filePatterns" multiple>
                    <option value="*">All Files (*)</option>
                    <option value="*.json">JSON</option>
                    <option value="*.csv">CSV</option>
                    <option value="*.xml">XML</option>
                    <option value="*.txt">Text</option>
                </select>
            </div>

            <!-- Storage Type -->
            <div id="step3" class="hidden">
                <label for="storageType">Select Storage Type:</label>
                <select id="storageType">
                    <option value="local">Local</option>
                    <option value="mysql">MySQL</option>
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mongodb">MongoDB</option>
                </select>
                <button type="button" id="nextToOutput">Next</button>
            </div>

            <!-- Output Configuration -->
            <div id="outputConfig" class="hidden">
                <!-- Local Storage Configuration (with Format Type Selection) -->
                <div id="localConfig" class="hidden">
                    <label for="formatType">Select Format Type:</label>
                    <select id="formatType">
                        <option value="json">JSON</option>
                        <option value="csv">CSV</option>
                    </select>

                    <label for="outputPath">Output Path:</label>
                    <input type="text" id="outputPath" placeholder="/path/to/store">
                </div>

                <!-- Database Configuration -->
                <div id="dbConfig" class="hidden">
                    <label for="dbHost">Host:</label>
                    <input type="text" id="dbHost" placeholder="localhost">

                    <label for="dbPort">Port:</label>
                    <input type="text" id="dbPort" placeholder="5432">

                    <label for="dbUser">Username:</label>
                    <input type="text" id="dbUser" placeholder="root">

                    <label for="dbPassword">Password:</label>
                    <input type="password" id="dbPassword" placeholder="password">

                    <label for="dbName">Database Name:</label>
                    <input type="text" id="dbName" placeholder="ingestion_db">
                </div>
            </div>

            <button type="submit" class="hidden" id="submitBtn">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
